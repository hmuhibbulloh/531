<!doctype html>
<html>
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>531</title>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>5/3/1 Cycle Generator</h1>
      <p>Enter your one rep maxes for each lift below.</p>

      <input id="ohp" name="ohp" type="number" />

      <input id="sqt" name="sqt" type="number" />

      <input id="dlt" name="dlt" type="number" />
      <button class="btn btn--calc">Calculate</button>
    </div>
  </body>
